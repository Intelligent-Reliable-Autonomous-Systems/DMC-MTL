# Model Configuration
PConfig:
    config_fpath: _configs_models/
    model: Ferguson_ColdHardiness_TensorBatch
    model_parameters: grape_coldhardiness:1 
    latitude: 46
    longitude: -120
    start_date: 2023-01-01
    input_vars: [DAY, TEMP, TMIN, TMAX]
    output_vars: [LTE50]
# Log configuration
log_path: /_runs/Journal3/RTMC/DeepMTL_3/
run_name: deep_mtl
seed: 0
# Data use
DataConfig: 
    cultivar: All
    data_fpath: _data/processed_data/
    data_cap: 3
    dtype: grape_coldhardiness_reg
    region: All
    station: All
    site: All
# Parameters
params: ["HCINIT", "HCMIN", "HCMAX", "TENDO", "TECO", "ENACCLIM", "ECACCLIM", "ENDEACCLIM", "ECDEACCLIM", "ECOBOUND"]
params_range: [[-15,-5], [-5, 0], [-40,-20], [10,20], [0,10], [0,0.2], [0,0.2], [0,0.2], [0,0.2], [-800,-200]]
DConfig: 
    type: Deep
    arch: EmbedFCGRU
    hidden_dim: 2048
    embed_op: concat_reg
    loss_func: MSELoss
    learning_rate: .0002
    lr_factor: 0.95
    batch_size: 72
    epochs: 200
    embed_size: 24
RTMCConfig:
  arch: EmbedFCGRU
  hidden_dim: 1024
  loss_func: MSELoss
  learning_rate: 0.0002
  lr_factor: 0.95
  batch_size: 12
  epochs: 300
  bias: False
  day_masking: True
