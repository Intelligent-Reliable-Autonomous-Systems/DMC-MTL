# Model Configuration
PConfig:
    config_fpath: _configs_models/
    model: Ferguson_ColdHardiness_TensorBatch 
    model_parameters: cherry_coldhardiness:1 
    latitude: 46
    longitude: -120
    start_date: 2023-09-07
    input_vars: [TEMP, TMIN, TMAX]
    output_vars: [LTE50]
# Log configuration
log_path: /_runs/Cherry/PaperExperiments/ColdHardiness/Deep/
run_name: deep_mtl
seed: 0
# Data use
DataConfig: 
    cultivar: All
    data_fpath: _data/processed_data/
    dtype: cherry_coldhardiness_ferg
    region: WA
    station: Roza2
    site: Prosser
    test_set_size: 1
# Parameters
params: ["HCINIT", "HCMIN", "HCMAX", "TENDO", "TECO", "ENACCLIM", "ECACCLIM", "ENDEACCLIM", "ECDEACCLIM", "ECOBOUND"]
params_range: [[-15,-5], [-5, 0], [-40,-20], [10,20], [0,10], [0,0.2], [0,0.2], [0,0.2], [0,0.2], [-800,-200]] 
DConfig: 
    type: Deep
    arch: EmbedFCGRU
    embed_op: concat
    hidden_dim: 2048
    loss_func: MSELoss
    learning_rate: .0002
    lr_factor: 0.95
    batch_size: 12
    epochs: 200
